services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: crms_db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - profile_uploads:/app/static/images/profiles
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: crms_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  mongo_data:
  profile_uploads:
