{% extends 'base.html' %}
{% block main %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 animate-in" style="animation-delay: 0.1s">
            <div class="glass-panel glossy-shine p-4 p-md-5">
                <div class="mb-5 text-center">
                    <div class="badge bg-danger bg-opacity-20 text-danger mb-3 px-3 py-2 rounded-pill fw-bold">Security
                        & Authentication</div>
                    <h3 class="fw-bold text-white">Security Protocol Update</h3>
                    <p class="text-glass-muted">Renew your digital access keys for maximum security</p>
                </div>

                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label text-glass-muted small fw-bold text-uppercase">Current Protocol
                            key</label>
                        <div class="position-relative">
                            <i
                                class="bi bi-shield-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-primary opacity-50"></i>
                            <input type="password" name="old_password" class="form-control glass-input ps-5"
                                placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-glass-muted small fw-bold text-uppercase">New Access
                            String</label>
                        <div class="position-relative">
                            <i
                                class="bi bi-key position-absolute top-50 start-0 translate-middle-y ms-3 text-primary opacity-50"></i>
                            <input type="password" name="new_password" class="form-control glass-input ps-5"
                                placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="form-label text-glass-muted small fw-bold text-uppercase">Logistics
                            Confirmation</label>
                        <div class="position-relative">
                            <i
                                class="bi bi-check2-circle position-absolute top-50 start-0 translate-middle-y ms-3 text-primary opacity-50"></i>
                            <input type="password" name="confirm_password" class="form-control glass-input ps-5"
                                placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-glass-primary w-100 py-3 shadow-lg">
                        Finalize Security Key <i class="bi bi-lock-fill ms-2"></i>
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <a href="/dashboard" class="text-glass-muted small text-decoration-none hover-white">Abandone
                        Protocol</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
