{% extends 'base.html' %}
{% block main %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 animate-in" style="animation-delay: 0.1s">
            <div class="glass-panel glossy-shine p-4 p-md-5">
                <div class="mb-5 text-center">
                    <div class="badge bg-primary bg-opacity-20 text-primary mb-3 px-3 py-2 rounded-pill fw-bold">
                        Identity Management</div>
                    <h3 class="fw-bold text-white">Update Academic Profile</h3>
                    <p class="text-glass-muted">Synchronize your personal records with the ecosystem</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    <div class="text-center mb-5">
                        <div class="position-relative d-inline-block">
                            <img src="{{ url_for('static', filename='images/' + current_user.profile_photo) }}"
                                class="rounded-circle border border-4 border-white border-opacity-20 shadow-lg"
                                style="width: 120px; height: 120px; object-fit: cover;" alt="Profile">
                            <label for="profile_photo"
                                class="position-absolute bottom-0 end-0 p-2 bg-primary text-white rounded-circle shadow-lg border-0 cursor-pointer"
                                title="Update Photo">
                                <i class="bi bi-camera-fill"></i>
                            </label>
                            <input type="file" id="profile_photo" name="profile_photo" class="d-none" accept="image/*">
                        </div>
                        <div class="text-glass-muted small mt-2">Digital Presence Avatar</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-glass-muted small fw-bold text-uppercase">Legal Presence</label>
                        <div class="position-relative">
                            <i
                                class="bi bi-person-badge position-absolute top-50 start-0 translate-middle-y ms-3 text-primary opacity-50"></i>
                            <input type="text" name="full_name" class="form-control glass-input ps-5"
                                value="{{ profile.full_name }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-glass-muted small fw-bold text-uppercase">Communication Node
                            (Phone)</label>
                        <div class="position-relative">
                            <i
                                class="bi bi-phone position-absolute top-50 start-0 translate-middle-y ms-3 text-primary opacity-50"></i>
                            <input type="text" name="phone" class="form-control glass-input ps-5"
                                value="{{ profile.phone or '' }}" placeholder="+1 (555) 000-0000">
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="form-label text-glass-muted small fw-bold text-uppercase">Residential
                            Coordinates</label>
                        <textarea name="address" class="form-control glass-input" rows="3"
                            placeholder="Primary residence address...">{{ profile.address or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-glass-primary w-100 py-3 shadow-lg">
                        Finalize Synchronization <i class="bi bi-arrow-repeat ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
